<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/vendor/bootstrap.min.css"><link rel="stylesheet" href="/vendor/bootstrap-icons.min.css"><link rel="stylesheet" href="/css/style.css?v=20261028"><title>Log in — Campus Connect</title></head><body>
<main class="auth-wrap" id="main">
  <aside class="auth-side login"><a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2 fw-semibold fs-4" style="font-family:var(--cc-serif)"><img src="/img/logo.svg" alt="" width="38" height="38"> Campus Connect</a>
    <div><h2>Welcome back.</h2><p>Your events, notes and notices are where you left them.</p></div>
    <div class="credit">Photo: Unsplash</div></aside>
  <section class="auth-form"><div class="inner">
    <a href="/" class="d-lg-none d-flex align-items-center gap-2 mb-4 text-decoration-none fw-semibold fs-5" style="font-family:var(--cc-serif);color:var(--cc-green-ink)"><img src="/img/logo.svg" alt="" width="32" height="32"> Campus Connect</a>
    <h1>Log in</h1><p class="text-secondary mb-4">Use your college email and password.</p>
    <div id="formAlert" role="alert"></div>
    <form id="loginForm" novalidate data-form="login">
      <div class="mb-3"><label class="form-label req" for="email">College email</label><input class="form-control" id="email" name="email" type="email" autocomplete="username" required><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label class="form-label req" for="password">Password</label>
        <div class="input-group"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-outline-secondary" type="button" data-toggle-pw="password" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback"></div></div></div>
      <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
    </form>
    <p class="text-secondary mt-4 mb-1">New here? <a href="/register.html">Create an account</a></p>
    <p class="small mb-0"><a href="/help.html">Forgot your password?</a></p>
  </div></section>
</main>
<script src="/vendor/bootstrap.bundle.min.js"></script><script type="module" src="/js/public.js?v=20261028"></script></body></html>
